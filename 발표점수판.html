<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모둠 발표 점수판</title>
<style>
  :root{
    --bg1:#1b1042;
    --bg2:#2d1b69;
    --card:#241454;
    --card-border:#4a2f8f;
    --accent:#ffb347;
    --accent2:#ff6b9d;
    --text:#f3eeff;
    --text-dim:#b8adde;
    --green:#4ade80;
    --red:#ff6b6b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    background:radial-gradient(ellipse at top, var(--bg2), var(--bg1) 70%);
    color:var(--text);
    padding-bottom:110px;
  }
  header{
    text-align:center;
    padding:28px 16px 10px;
  }
  header h1{
    margin:0;
    font-size:clamp(22px,4vw,34px);
    letter-spacing:1px;
    text-shadow:0 0 18px rgba(255,179,71,.5);
  }
  header p{
    margin:6px 0 0;
    color:var(--text-dim);
    font-size:14px;
  }
  .topbar{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:14px;
    flex-wrap:wrap;
  }
  .btn{
    border:none;
    border-radius:10px;
    padding:9px 16px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease;
    color:#241454;
    background:var(--text-dim);
  }
  .btn:hover{transform:translateY(-2px);}
  .btn:active{transform:translateY(0);}
  .btn-outline{
    background:transparent;
    color:var(--text);
    border:1px solid var(--card-border);
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:18px;
    max-width:1180px;
    margin:24px auto;
    padding:0 20px;
  }
  .card{
    background:linear-gradient(160deg,var(--card),#1a0f3d);
    border:1px solid var(--card-border);
    border-radius:18px;
    padding:18px;
    text-align:center;
    position:relative;
    overflow:hidden;
    box-shadow:0 8px 24px rgba(0,0,0,.35);
    transition:box-shadow .2s ease;
  }
  .card.leveling{
    animation:levelPulse .9s ease;
  }
  @keyframes levelPulse{
    0%{box-shadow:0 8px 24px rgba(0,0,0,.35);}
    30%{box-shadow:0 0 45px 10px rgba(255,179,71,.7);}
    100%{box-shadow:0 8px 24px rgba(0,0,0,.35);}
  }
  .gname{
    font-size:17px;
    font-weight:700;
    outline:none;
    border-radius:6px;
    padding:2px 6px;
    cursor:text;
  }
  .gname:focus{background:rgba(255,255,255,.08);}
  .stage-label{
    font-size:12.5px;
    color:var(--accent);
    font-weight:600;
    margin-top:2px;
    letter-spacing:.5px;
  }
  .creature{
    font-size:78px;
    line-height:1;
    margin:10px 0 4px;
    display:inline-block;
    filter:drop-shadow(0 6px 14px rgba(0,0,0,.4));
    animation:idleFloat 3s ease-in-out infinite;
  }
  @keyframes idleFloat{
    0%,100%{transform:translateY(0) rotate(0deg);}
    50%{transform:translateY(-8px) rotate(-3deg);}
  }
  .creature.pop{
    animation:popGrow .7s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes popGrow{
    0%{transform:scale(.3) rotate(-15deg);opacity:0;}
    60%{transform:scale(1.3) rotate(8deg);opacity:1;}
    100%{transform:scale(1) rotate(0deg);}
  }
  .score{
    font-size:30px;
    font-weight:800;
    margin-top:2px;
    color:#fff;
  }
  .score small{
    font-size:13px;
    font-weight:500;
    color:var(--text-dim);
  }
  .progress-wrap{
    margin:10px 0 4px;
  }
  .progress-track{
    background:rgba(255,255,255,.08);
    border-radius:20px;
    height:9px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg,var(--accent2),var(--accent));
    border-radius:20px;
    transition:width .5s ease;
  }
  .progress-text{
    font-size:11px;
    color:var(--text-dim);
    margin-top:5px;
  }
  .btn-row{
    display:flex;
    gap:8px;
    margin-top:14px;
    justify-content:center;
  }
  .score-btn{
    border:none;
    border-radius:10px;
    width:42px;
    height:38px;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
    transition:transform .1s ease;
  }
  .score-btn:active{transform:scale(.9);}
  .plus1{background:var(--green);color:#0a3d1f;}
  .plus3{background:var(--accent);color:#4a2f00;font-size:13px;width:52px;}
  .minus1{background:var(--red);color:#4a0a0a;}

  .fab{
    position:fixed;
    left:50%;
    bottom:22px;
    transform:translateX(-50%);
    background:linear-gradient(135deg,var(--accent2),var(--accent));
    color:#2b1400;
    border:none;
    padding:14px 26px;
    border-radius:40px;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
    box-shadow:0 10px 30px rgba(255,107,157,.45);
    z-index:50;
    transition:transform .15s ease;
  }
  .fab:hover{transform:translateX(-50%) scale(1.05);}

  .overlay{
    position:fixed;inset:0;
    background:rgba(10,5,25,.75);
    backdrop-filter:blur(3px);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:100;
    padding:16px;
  }
  .overlay.show{display:flex;}
  .modal{
    background:linear-gradient(160deg,#241454,#170a38);
    border:1px solid var(--card-border);
    border-radius:22px;
    padding:26px;
    max-width:440px;
    width:100%;
    text-align:center;
    position:relative;
    max-height:92vh;
    overflow-y:auto;
  }
  .modal h2{margin-top:0;}
  .modal-close{
    position:absolute;
    top:14px;right:16px;
    background:none;border:none;
    color:var(--text-dim);
    font-size:22px;
    cursor:pointer;
  }
  .wheel-area{
    position:relative;
    width:280px;height:280px;
    margin:16px auto;
  }
  .pointer{
    position:absolute;
    top:-8px;left:50%;
    transform:translateX(-50%);
    width:0;height:0;
    border-left:14px solid transparent;
    border-right:14px solid transparent;
    border-top:24px solid var(--accent);
    z-index:5;
    filter:drop-shadow(0 2px 4px rgba(0,0,0,.5));
  }
  .wheel{
    width:100%;height:100%;
    border-radius:50%;
    border:6px solid var(--accent);
    position:relative;
    box-shadow:0 0 30px rgba(255,179,71,.4), inset 0 0 20px rgba(0,0,0,.4);
    transition:transform 4.2s cubic-bezier(.15,.85,.25,1);
  }
  .wheel-label{
    position:absolute;
    width:64px;
    text-align:center;
    font-weight:800;
    font-size:12.5px;
    line-height:1.2;
    color:#241454;
    transform:translate(-50%,-50%);
    pointer-events:none;
  }
  .wheel-center{
    position:absolute;
    top:50%;left:50%;
    width:26px;height:26px;
    background:var(--accent);
    border-radius:50%;
    transform:translate(-50%,-50%);
    box-shadow:0 0 8px rgba(0,0,0,.4);
    z-index:4;
  }
  .spin-btn{
    background:linear-gradient(135deg,var(--accent2),var(--accent));
    color:#2b1400;
    border:none;
    padding:12px 30px;
    border-radius:40px;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
    margin-top:8px;
  }
  .spin-btn:disabled{opacity:.5;cursor:not-allowed;}
  .exclude-row{
    display:flex;flex-wrap:wrap;gap:8px;
    justify-content:center;
    margin:14px 0 4px;
  }
  .chip{
    border:1px solid var(--card-border);
    border-radius:20px;
    padding:6px 12px;
    font-size:13px;
    cursor:pointer;
    background:rgba(255,255,255,.05);
    color:var(--text);
    transition:all .15s ease;
  }
  .chip.excluded{
    background:rgba(255,107,107,.15);
    border-color:var(--red);
    color:var(--text-dim);
    text-decoration:line-through;
  }
  .exclude-hint{
    font-size:11.5px;
    color:var(--text-dim);
    margin-top:2px;
  }
  .result-banner{
    margin-top:16px;
    font-size:22px;
    font-weight:800;
    min-height:32px;
    color:var(--accent);
    text-shadow:0 0 12px rgba(255,179,71,.6);
  }
  .settings-grid{
    display:flex;flex-direction:column;gap:14px;
    text-align:left;
    margin-top:16px;
  }
  .settings-grid label{
    font-size:13px;
    color:var(--text-dim);
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
  }
  .settings-grid input{
    width:80px;
    padding:6px 8px;
    border-radius:8px;
    border:1px solid var(--card-border);
    background:rgba(255,255,255,.06);
    color:var(--text);
    font-size:14px;
    text-align:center;
  }
  .gear{
    position:fixed;
    top:20px;right:20px;
    background:rgba(255,255,255,.08);
    border:1px solid var(--card-border);
    color:var(--text);
    width:40px;height:40px;
    border-radius:50%;
    font-size:18px;
    cursor:pointer;
    z-index:40;
  }
  .confetti{
    position:fixed;
    width:9px;height:14px;
    top:-20px;
    z-index:200;
    pointer-events:none;
    border-radius:2px;
    animation:fall linear forwards;
  }
  @keyframes fall{
    to{transform:translateY(110vh) rotate(600deg);opacity:.3;}
  }
  footer{
    text-align:center;
    color:var(--text-dim);
    font-size:11.5px;
    margin-top:30px;
    padding:0 20px;
  }
</style>
</head>
<body>

<button class="gear" id="gearBtn" title="설정">⚙️</button>

<header>
  <h1>🐣 모둠 발표 성장 점수판 🐉</h1>
  <p>발표할 때마다 점수를 올려 알을 드래곤으로 키워보세요!</p>
  <div class="topbar">
    <button class="btn btn-outline" id="resetScoresBtn">전체 점수 초기화</button>
  </div>
</header>

<div class="grid" id="grid"></div>

<button class="fab" id="openWheelBtn">🎡 발표할 모둠 뽑기</button>

<!-- 돌림판 모달 -->
<div class="overlay" id="wheelOverlay">
  <div class="modal">
    <button class="modal-close" id="closeWheelBtn">✕</button>
    <h2>🎡 발표 모둠 뽑기</h2>
    <div class="exclude-row" id="excludeRow"></div>
    <div class="exclude-hint">이미 발표한 모둠을 눌러 제외할 수 있어요</div>
    <div class="wheel-area">
      <div class="pointer"></div>
      <div class="wheel" id="wheel"></div>
      <div class="wheel-center"></div>
    </div>
    <button class="spin-btn" id="spinBtn">돌리기!</button>
    <div class="result-banner" id="resultBanner"></div>
  </div>
</div>

<!-- 초기화 확인 모달 -->
<div class="overlay" id="resetConfirmOverlay">
  <div class="modal" style="max-width:360px;">
    <h2>점수 초기화</h2>
    <p style="color:var(--text-dim);font-size:14px;line-height:1.6;">모든 모둠의 점수를 0으로 초기화할까요?<br>이 작업은 되돌릴 수 없어요.</p>
    <div style="display:flex;gap:10px;justify-content:center;margin-top:18px;">
      <button class="btn btn-outline" id="cancelResetBtn">취소</button>
      <button class="btn" id="confirmResetBtn" style="background:var(--red);color:#fff;">초기화</button>
    </div>
  </div>
</div>

<!-- 설정 모달 -->
<div class="overlay" id="settingsOverlay">
  <div class="modal">
    <button class="modal-close" id="closeSettingsBtn">✕</button>
    <h2>⚙️ 진화 설정</h2>
    <div class="settings-grid">
      <label>발표 1회당 점수 <input type="number" id="stepInput" min="1" max="20"></label>
      <label>🐲 새끼 용 진화 점수 <input type="number" id="tier2Input" min="1" max="100"></label>
      <label>🐉 드래곤 진화 점수 <input type="number" id="tier3Input" min="1" max="100"></label>
    </div>
    <button class="btn" id="saveSettingsBtn" style="margin-top:18px;background:var(--accent);">저장</button>
  </div>
</div>

<footer>점수와 설정은 이 브라우저에 자동 저장됩니다.</footer>

<script>
const STORAGE_KEY = 'presentationScoreApp_v2';
const STAGES = [
  {name:'알', emoji:'🥚'},
  {name:'새끼 용', emoji:'🐲'},
  {name:'드래곤', emoji:'🐉'}
];
const COLORS = ['#ff9f68','#ffd166','#7bdff2','#a5ffd6','#c9a5ff','#ff8fb1'];

let state = loadState();

function defaultState(){
  return {
    settings:{step:1, tier2:3, tier3:6},
    groups:[1,2,3,4,5,6].map(n=>({id:n, name:'모둠 '+n, score:0})),
    excluded:[]
  };
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    if(!parsed.groups || parsed.groups.length!==6) return defaultState();
    if(!parsed.excluded) parsed.excluded = [];
    return parsed;
  }catch(e){
    return defaultState();
  }
}

function saveState(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function getStageIndex(score){
  const {tier2, tier3} = state.settings;
  if(score >= tier3) return 2;
  if(score >= tier2) return 1;
  return 0;
}

function getProgress(score){
  const {tier2, tier3} = state.settings;
  const idx = getStageIndex(score);
  if(idx === 2){
    return {pct:100, text:'최고 단계 달성! 계속 응원해주세요 ✨'};
  }
  const lo = idx===0 ? 0 : tier2;
  const hi = idx===0 ? tier2 : tier3;
  const pct = Math.min(100, Math.round(((score-lo)/(hi-lo))*100));
  return {pct, text:`다음 진화까지 ${hi-score}점 남음`};
}

const grid = document.getElementById('grid');

function render(){
  grid.innerHTML = '';
  state.groups.forEach(g=>{
    const idx = getStageIndex(g.score);
    const stage = STAGES[idx];
    const prog = getProgress(g.score);
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.id = g.id;
    card.innerHTML = `
      <div class="gname" contenteditable="true" spellcheck="false" data-id="${g.id}">${escapeHtml(g.name)}</div>
      <div class="stage-label">${stage.name} 단계</div>
      <div class="creature" data-id="${g.id}">${stage.emoji}</div>
      <div class="score">${g.score}<small> 점</small></div>
      <div class="progress-wrap">
        <div class="progress-track"><div class="progress-fill" style="width:${prog.pct}%"></div></div>
        <div class="progress-text">${prog.text}</div>
      </div>
      <div class="btn-row">
        <button class="score-btn minus1" data-id="${g.id}" data-delta="-${state.settings.step}">-${state.settings.step}</button>
        <button class="score-btn plus1" data-id="${g.id}" data-delta="${state.settings.step}">+${state.settings.step}</button>
        <button class="score-btn plus3" data-id="${g.id}" data-delta="3">보너스+3</button>
      </div>
    `;
    grid.appendChild(card);
  });
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

grid.addEventListener('click', e=>{
  const btn = e.target.closest('.score-btn');
  if(!btn) return;
  const id = Number(btn.dataset.id);
  const delta = Number(btn.dataset.delta);
  const g = state.groups.find(x=>x.id===id);
  if(!g) return;
  const prevStage = getStageIndex(g.score);
  g.score = Math.max(0, g.score + delta);
  const newStage = getStageIndex(g.score);
  saveState();
  render();
  const card = grid.querySelector(`.card[data-id="${id}"]`);
  const creature = grid.querySelector(`.creature[data-id="${id}"]`);
  if(newStage > prevStage){
    card.classList.add('leveling');
    creature.classList.add('pop');
    burstConfetti(card);
    setTimeout(()=>{card.classList.remove('leveling'); creature.classList.remove('pop');}, 900);
  }
});

grid.addEventListener('blur', e=>{
  const el = e.target.closest('.gname');
  if(!el) return;
  const id = Number(el.dataset.id);
  const g = state.groups.find(x=>x.id===id);
  if(!g) return;
  const val = el.textContent.trim() || g.name;
  g.name = val;
  saveState();
}, true);

grid.addEventListener('keydown', e=>{
  if(e.target.closest('.gname') && e.key === 'Enter'){
    e.preventDefault();
    e.target.blur();
  }
});

const resetConfirmOverlay = document.getElementById('resetConfirmOverlay');
document.getElementById('resetScoresBtn').addEventListener('click', ()=>{
  resetConfirmOverlay.classList.add('show');
});
document.getElementById('cancelResetBtn').addEventListener('click', ()=>{
  resetConfirmOverlay.classList.remove('show');
});
resetConfirmOverlay.addEventListener('click', e=>{
  if(e.target === resetConfirmOverlay) resetConfirmOverlay.classList.remove('show');
});
document.getElementById('confirmResetBtn').addEventListener('click', ()=>{
  state.groups.forEach(g=>g.score=0);
  saveState();
  render();
  resetConfirmOverlay.classList.remove('show');
});

function burstConfetti(anchor){
  const rect = anchor.getBoundingClientRect();
  const cx = rect.left + rect.width/2;
  for(let i=0;i<26;i++){
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = (cx + (Math.random()*140-70)) + 'px';
    c.style.background = COLORS[Math.floor(Math.random()*COLORS.length)];
    c.style.animationDuration = (1.1 + Math.random()*0.9)+'s';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(), 2200);
  }
}

/* ===== 돌림판 ===== */
const wheelOverlay = document.getElementById('wheelOverlay');
const wheelEl = document.getElementById('wheel');
const excludeRow = document.getElementById('excludeRow');
const spinBtn = document.getElementById('spinBtn');
const resultBanner = document.getElementById('resultBanner');
let currentRotation = 0;
let spinning = false;

function getAvailableGroups(){
  return state.groups.filter(g=>!state.excluded.includes(g.id));
}

function buildWheel(){
  const avail = getAvailableGroups();
  const n = avail.length;
  wheelEl.innerHTML = '';

  if(n === 0){
    wheelEl.style.background = 'rgba(255,255,255,.08)';
    spinBtn.disabled = true;
    return;
  }
  spinBtn.disabled = false;

  const sectorAngle = 360/n;
  let gradientParts = [];
  avail.forEach((g,i)=>{
    const start = i*sectorAngle;
    const end = (i+1)*sectorAngle;
    const colorIdx = state.groups.findIndex(x=>x.id===g.id);
    gradientParts.push(`${COLORS[colorIdx%COLORS.length]} ${start}deg ${end}deg`);
    const label = document.createElement('div');
    label.className = 'wheel-label';
    const mid = start + sectorAngle/2;
    const rad = (mid * Math.PI) / 180;
    const radius = 88;
    const x = radius * Math.sin(rad);
    const y = -radius * Math.cos(rad);
    label.style.left = `calc(50% + ${x}px)`;
    label.style.top = `calc(50% + ${y}px)`;
    label.textContent = g.name;
    wheelEl.appendChild(label);
  });
  wheelEl.style.background = `conic-gradient(${gradientParts.join(',')})`;
}

function buildExcludeRow(){
  excludeRow.innerHTML = '';
  state.groups.forEach(g=>{
    const chip = document.createElement('div');
    const isExcluded = state.excluded.includes(g.id);
    chip.className = 'chip' + (isExcluded ? ' excluded' : '');
    chip.textContent = g.name;
    chip.dataset.id = g.id;
    excludeRow.appendChild(chip);
  });
}

excludeRow.addEventListener('click', e=>{
  if(spinning) return;
  const chip = e.target.closest('.chip');
  if(!chip) return;
  const id = Number(chip.dataset.id);
  const pos = state.excluded.indexOf(id);
  if(pos===-1) state.excluded.push(id); else state.excluded.splice(pos,1);
  saveState();
  buildExcludeRow();
  buildWheel();
  resultBanner.textContent = '';
});

document.getElementById('openWheelBtn').addEventListener('click', ()=>{
  buildWheel();
  buildExcludeRow();
  resultBanner.textContent = '';
  wheelOverlay.classList.add('show');
});
document.getElementById('closeWheelBtn').addEventListener('click', ()=>{
  wheelOverlay.classList.remove('show');
});
wheelOverlay.addEventListener('click', e=>{
  if(e.target === wheelOverlay) wheelOverlay.classList.remove('show');
});

spinBtn.addEventListener('click', ()=>{
  if(spinning) return;
  const avail = getAvailableGroups();
  if(avail.length === 0){
    resultBanner.textContent = '모든 모둠이 제외되어 있어요!';
    return;
  }
  spinning = true;
  spinBtn.disabled = true;
  resultBanner.textContent = '';

  const n = avail.length;
  const sectorAngle = 360/n;
  const winIdx = Math.floor(Math.random()*avail.length);
  const winner = avail[winIdx];

  const margin = n === 1 ? 0 : sectorAngle*0.15;
  const randomOffset = margin + Math.random()*(sectorAngle - margin*2);
  const targetOriginalAngle = winIdx*sectorAngle + randomOffset;
  const needMod = (360 - targetOriginalAngle + 360*10) % 360;
  const fullSpins = 5 + Math.floor(Math.random()*3);
  const curMod = ((currentRotation % 360) + 360) % 360;
  const delta = ((needMod - curMod) + 360) % 360;
  currentRotation += fullSpins*360 + delta;

  wheelEl.style.transform = `rotate(${currentRotation}deg)`;

  setTimeout(()=>{
    spinning = false;
    spinBtn.disabled = false;
    resultBanner.textContent = `🎉 ${winner.name} 발표하세요! 🎉`;
    burstConfettiCenter();
  }, 4300);
});

function burstConfettiCenter(){
  const rect = wheelEl.getBoundingClientRect();
  const cx = rect.left + rect.width/2;
  for(let i=0;i<40;i++){
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = (cx + (Math.random()*220-110)) + 'px';
    c.style.top = (rect.top) + 'px';
    c.style.background = COLORS[Math.floor(Math.random()*COLORS.length)];
    c.style.animationDuration = (1.2 + Math.random()*1)+'s';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(), 2400);
  }
}

/* ===== 설정 ===== */
const settingsOverlay = document.getElementById('settingsOverlay');
document.getElementById('gearBtn').addEventListener('click', ()=>{
  document.getElementById('stepInput').value = state.settings.step;
  document.getElementById('tier2Input').value = state.settings.tier2;
  document.getElementById('tier3Input').value = state.settings.tier3;
  settingsOverlay.classList.add('show');
});
document.getElementById('closeSettingsBtn').addEventListener('click', ()=>{
  settingsOverlay.classList.remove('show');
});
settingsOverlay.addEventListener('click', e=>{
  if(e.target === settingsOverlay) settingsOverlay.classList.remove('show');
});
document.getElementById('saveSettingsBtn').addEventListener('click', ()=>{
  const step = Math.max(1, Number(document.getElementById('stepInput').value) || 1);
  let tier2 = Math.max(1, Number(document.getElementById('tier2Input').value) || 3);
  let tier3 = Math.max(tier2+1, Number(document.getElementById('tier3Input').value) || tier2+1);
  state.settings = {step, tier2, tier3};
  saveState();
  render();
  settingsOverlay.classList.remove('show');
});

render();
</script>
