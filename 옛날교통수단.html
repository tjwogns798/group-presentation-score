<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>옛날 교통수단 여행</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#fbf3e0;
    --ink:#3b2a1a;
    --ink-dim:#7a6450;
    --wood:#8a5a32;
    --accent:#d9452b;
    --teal:#2aa6a0;
    --gold:#f2b632;
    --card:#fffaf0;
    --line:#e3d2b0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    font-family:'Jua','Malgun Gothic',sans-serif;
    background:#efe2c4 radial-gradient(ellipse at top,#fff6df,#e9d6ad 80%);
    color:var(--ink);
    overflow-x:hidden;
    -webkit-user-select:none;user-select:none;
    -webkit-tap-highlight-color:transparent;
  }
  .hidden{display:none !important;}
  button{font-family:inherit;cursor:pointer;}
  .screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px;}

  /* 타이틀 */
  #title{justify-content:center;text-align:center;gap:14px;}
  #title h1{font-size:clamp(36px,7vw,72px);margin:0;color:var(--ink);text-shadow:3px 3px 0 #fff,6px 6px 0 rgba(0,0,0,.08);}
  #title .sub{font-size:clamp(16px,2.4vw,24px);color:var(--ink-dim);margin:0;}
  #titleArt{width:min(720px,92vw);aspect-ratio:16/7;border-radius:24px;border:4px solid var(--wood);background:#cfe9f7;box-shadow:0 10px 0 rgba(0,0,0,.1);}
  .bigbtn{
    font-size:clamp(22px,3vw,30px);padding:14px 44px;border:none;border-radius:999px;
    background:var(--accent);color:#fff;box-shadow:0 6px 0 #9c2a17;transition:transform .1s;
  }
  .bigbtn:hover{transform:translateY(-2px);}
  .bigbtn:active{transform:translateY(4px);box-shadow:0 2px 0 #9c2a17;}
  .ghost{background:#fff;color:var(--ink);box-shadow:0 6px 0 var(--line);}
  .ghost:active{box-shadow:0 2px 0 var(--line);}

  /* 지도 */
  #map h2{margin:6px 0 2px;font-size:clamp(26px,4vw,40px);}
  #map .hint{margin:0 0 14px;color:var(--ink-dim);font-size:18px;text-align:center;}
  .group-title{width:min(1100px,100%);font-size:22px;margin:10px 0 8px;display:flex;align-items:center;gap:8px;}
  .group-title span{font-size:15px;color:var(--ink-dim);}
  .cards{width:min(1100px,100%);display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;}
  .card{
    position:relative;background:var(--card);border:3px solid var(--line);border-radius:20px;padding:10px;
    text-align:left;color:var(--ink);box-shadow:0 6px 0 var(--line);transition:transform .12s;
  }
  .card:hover{transform:translateY(-4px);border-color:var(--teal);}
  .card canvas{width:100%;aspect-ratio:16/9;border-radius:12px;display:block;background:#cfe9f7;}
  .card .nm{font-size:26px;margin:8px 4px 0;display:flex;justify-content:space-between;align-items:center;}
  .card .pw{display:inline-block;font-size:14px;padding:3px 10px;border-radius:999px;background:#e8f6f5;color:#1d7c77;margin:4px 4px 0;}
  .card .pw.machine{background:#eee6ff;color:#5b3fb0;}
  .card .pw.animal{background:#fff0dc;color:#a35b10;}
  .card .pw.nature{background:#e3f3ff;color:#1b66a3;}
  .stars{font-size:20px;letter-spacing:2px;color:var(--gold);}
  .stars .off{color:#d8ccb4;}
  .stamp{
    position:absolute;top:14px;right:14px;width:66px;height:66px;border-radius:50%;
    border:4px solid var(--accent);color:var(--accent);display:flex;align-items:center;justify-content:center;
    font-size:17px;transform:rotate(-14deg);background:rgba(255,250,240,.85);line-height:1.05;text-align:center;
  }
  .maprow{display:flex;gap:12px;margin:22px 0 10px;flex-wrap:wrap;justify-content:center;}
  .small{font-size:15px;color:var(--ink-dim);background:none;border:none;text-decoration:underline;}

  /* 플레이 */
  #play{padding:10px 16px;gap:10px;}
  .topbar{width:100%;max-width:1200px;display:flex;gap:8px;justify-content:space-between;align-items:center;}
  .topbar .l,.topbar .r{display:flex;gap:8px;}
  .tbtn{font-size:17px;padding:8px 14px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink);}
  .tbtn:active{transform:translateY(2px);}
  #game{
    position:relative;width:min(100%, calc((100vh - 190px) * 16 / 9));max-width:1200px;aspect-ratio:16/9;
    border-radius:18px;overflow:hidden;border:4px solid var(--wood);background:#000;box-shadow:0 8px 0 rgba(0,0,0,.12);
  }
  #cv{width:100%;height:100%;display:block;touch-action:none;}
  .ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(40,25,10,.55);padding:14px;}
  .panel{
    background:var(--paper);border:4px solid var(--wood);border-radius:22px;padding:18px 22px;width:min(640px,100%);
    max-height:100%;overflow:auto;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.2);
  }
  .panel h3{margin:0;font-size:clamp(26px,4vw,40px);}
  .panel .tag{display:inline-block;margin:6px 0;padding:4px 14px;border-radius:999px;background:var(--teal);color:#fff;font-size:17px;}
  .fact{background:#fff;border:2px dashed var(--line);border-radius:14px;padding:10px 14px;margin:10px 0;font-size:19px;line-height:1.5;}
  .mission{font-size:20px;margin:8px 0;line-height:1.45;}
  .keys{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0 14px;}
  .keys div{background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 12px;font-size:16px;}
  .keys b{color:var(--accent);font-weight:normal;}
  .resstars{font-size:54px;color:var(--gold);letter-spacing:6px;margin:4px 0;}
  .resstars .off{color:#d8ccb4;}
  .quiz{margin-top:10px;text-align:left;}
  .quiz .q{font-size:21px;margin:6px 0 10px;text-align:center;}
  .choice{
    display:block;width:100%;margin:8px 0;padding:11px 14px;font-size:19px;text-align:left;
    border-radius:14px;border:3px solid var(--line);background:#fff;color:var(--ink);
  }
  .choice:hover{border-color:var(--teal);}
  .choice.right{background:#e2f7e8;border-color:#3bb36a;}
  .choice.wrong{background:#fde6e2;border-color:var(--accent);animation:shake .35s;}
  .explain{font-size:18px;color:#1d7c77;min-height:26px;text-align:center;margin:6px 0;}
  @keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

  #pad{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;width:100%;max-width:1200px;}
  .pbtn{
    flex:1 1 0;min-width:110px;max-width:260px;min-height:64px;font-size:21px;border:none;border-radius:18px;
    background:#fff;color:var(--ink);box-shadow:0 6px 0 var(--line);touch-action:none;
  }
  .pbtn.on{transform:translateY(4px);box-shadow:0 2px 0 var(--line);background:#fff2d6;}

  /* 정리 활동 */
  #sort h2{margin:6px 0 4px;font-size:clamp(26px,4vw,40px);}
  #sort .hint{margin:0 0 12px;color:var(--ink-dim);font-size:18px;text-align:center;}
  .tray{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:62px;width:min(1100px,100%);margin-bottom:14px;}
  .chip{font-size:22px;padding:10px 18px;border-radius:14px;border:3px solid var(--line);background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line);}
  .chip.sel{border-color:var(--accent);background:#fff2d6;transform:translateY(-3px);}
  .chip.wrong{animation:shake .35s;border-color:var(--accent);}
  .bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;width:min(1100px,100%);}
  .bin{border-radius:20px;border:3px dashed var(--line);background:var(--card);padding:12px;min-height:150px;text-align:center;color:var(--ink);}
  .bin:hover{border-color:var(--teal);}
  .bin h4{margin:0 0 4px;font-size:24px;}
  .bin p{margin:0 0 8px;font-size:15px;color:var(--ink-dim);}
  .bin .in{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;}
  .bin .in span{font-size:18px;padding:5px 12px;border-radius:10px;background:#e2f7e8;border:2px solid #3bb36a;}
  .summary{width:min(900px,100%);margin-top:16px;font-size:21px;line-height:1.6;text-align:center;background:#fff;border:3px solid var(--teal);border-radius:20px;padding:14px 18px;}
</style>
</head>
<body>

<!-- 타이틀 -->
<div id="title" class="screen">
  <p class="sub">사회 · 옛날 사람들이 교통수단을 이용했던 모습</p>
  <h1>옛날 교통수단 여행</h1>
  <canvas id="titleArt" width="1440" height="630"></canvas>
  <p class="sub">말, 달구지, 가마, 뗏목, 나룻배, 돛단배를 직접 타고 움직여 봐요!</p>
  <button class="bigbtn" id="btnStart">여행 떠나기</button>
</div>

<!-- 지도 -->
<div id="map" class="screen hidden">
  <h2>🗺 교통수단 여행 지도</h2>
  <p class="hint">타 보고 싶은 교통수단을 골라요. 임무를 마치고 퀴즈를 맞히면 도장을 받아요!</p>
  <div class="group-title">① 옛날 사람들이 이용했던 교통수단 <span>사람 · 동물 · 자연의 힘</span></div>
  <div class="cards" id="cardsOld"></div>
  <div class="group-title" style="margin-top:22px">② 기술의 발달에 따라 등장한 교통수단 <span>기계의 힘</span></div>
  <div class="cards" id="cardsNew"></div>
  <div class="maprow">
    <button class="bigbtn" id="btnSort">✍ 오늘 배운 내용 정리하기</button>
  </div>
  <button class="small" id="btnReset">도장 기록 지우기</button>
</div>

<!-- 플레이 -->
<div id="play" class="screen hidden">
  <div class="topbar">
    <div class="l"><button class="tbtn" id="btnQuit">🗺 지도로</button><button class="tbtn" id="btnRetry">↺ 처음부터</button></div>
    <div class="r"><button class="tbtn" id="btnSound">🔊 소리 켬</button></div>
  </div>
  <div id="game">
    <canvas id="cv"></canvas>
    <div id="intro" class="ov"><div class="panel" id="introPanel"></div></div>
    <div id="result" class="ov hidden"><div class="panel" id="resultPanel"></div></div>
  </div>
  <div id="pad"></div>
</div>

<!-- 정리 활동 -->
<div id="sort" class="screen hidden">
  <h2>✍ 무엇의 힘으로 움직였을까?</h2>
  <p class="hint">교통수단 카드를 누른 다음, 알맞은 상자를 눌러 넣어 보세요.</p>
  <div class="tray" id="tray"></div>
  <div class="bins" id="bins"></div>
  <div class="summary hidden" id="summary"></div>
  <div class="maprow"><button class="bigbtn ghost" id="btnSortBack">🗺 지도로 돌아가기</button></div>
</div>

<script>
'use strict';
const W = 960, H = 540, TAU = Math.PI * 2;
let T = 0;

/* ---------------- 그리기 도우미 ---------------- */
function circ(c,x,y,r,f){c.beginPath();c.arc(x,y,r,0,TAU);c.fillStyle=f;c.fill();}
function ell(c,x,y,rx,ry,f,rot=0){c.beginPath();c.ellipse(x,y,Math.max(0.1,rx),Math.max(0.1,ry),rot,0,TAU);c.fillStyle=f;c.fill();}
function rr(c,x,y,w,h,r,f){c.beginPath();c.roundRect(x,y,w,h,r);c.fillStyle=f;c.fill();}
function ln(c,x1,y1,x2,y2,col,w){c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.strokeStyle=col;c.lineWidth=w;c.lineCap='round';c.stroke();}
function hash(n){const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s);}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function angDiff(a,b){let d=a-b;while(d>Math.PI)d-=TAU;while(d<-Math.PI)d+=TAU;return d;}
function txt(c,s,x,y,size,col,align='center',stroke){
  c.font=`${size}px Jua, "Malgun Gothic", sans-serif`;c.textAlign=align;c.textBaseline='middle';
  if(stroke){c.lineWidth=Math.max(3,size/5);c.strokeStyle=stroke;c.lineJoin='round';c.strokeText(s,x,y);}
  c.fillStyle=col;c.fillText(s,x,y);
}
function sky(c,top,bot){const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,top);g.addColorStop(1,bot);c.fillStyle=g;c.fillRect(0,0,W,H);}
function mountains(c,o,base,col,amp,wl){
  c.beginPath();c.moveTo(0,H);
  for(let x=0;x<=W+20;x+=16){
    const u=x+o;
    const y=base-amp*(0.55+0.45*Math.sin(u/wl))*(0.65+0.35*Math.sin(u/(wl*0.37)+1.3));
    c.lineTo(x,y);
  }
  c.lineTo(W,H);c.closePath();c.fillStyle=col;c.fill();
}
function cloud(c,x,y,s){c.save();c.globalAlpha=.9;circ(c,x,y,22*s,'#fff');circ(c,x+24*s,y-8*s,26*s,'#fff');circ(c,x+50*s,y,20*s,'#fff');ell(c,x+24*s,y+8*s,46*s,12*s,'#fff');c.restore();}
function clouds(c,o){for(let k=0;k<5;k++){const x=((k*260-o)%(W+300)+W+300)%(W+300)-150;cloud(c,x,60+hash(k)*70,0.8+hash(k+9)*0.5);}}

// 초가집 (옆모습)
function chogajip(c,x,y,s){
  c.save();c.translate(x,y);c.scale(s,s);
  rr(c,-50,-50,100,50,3,'#efe3c6');
  c.fillStyle='#8a6a43';c.fillRect(-50,-50,6,50);c.fillRect(44,-50,6,50);
  rr(c,-12,-40,24,40,2,'#7a5532');
  rr(c,22,-36,16,14,2,'#c9b48a');
  c.beginPath();c.moveTo(-66,-44);c.quadraticCurveTo(-62,-102,0,-104);c.quadraticCurveTo(62,-102,66,-44);c.closePath();
  c.fillStyle='#d6ad5f';c.fill();
  c.strokeStyle='#b98c3e';c.lineWidth=2;
  for(let i=-2;i<=2;i++){c.beginPath();c.moveTo(i*22,-102+Math.abs(i)*6);c.quadraticCurveTo(i*30,-70,i*28,-46);c.stroke();}
  c.restore();
}
// 기와집 (옆모습)
function giwajip(c,x,y,s,label){
  c.save();c.translate(x,y);c.scale(s,s);
  rr(c,-110,-40,220,40,2,'#d8cdb5');
  c.fillStyle='#a33';c.fillRect(-100,-80,8,40);c.fillRect(92,-80,8,40);
  rr(c,-92,-80,184,42,2,'#f3ead5');
  rr(c,-26,-78,52,78,3,'#7b3b22');ln(c,0,-78,0,0,'#5a2a16',3);
  c.beginPath();c.moveTo(-150,-74);c.quadraticCurveTo(-120,-86,-96,-108);c.lineTo(96,-108);c.quadraticCurveTo(120,-86,150,-74);
  c.quadraticCurveTo(120,-80,100,-84);c.lineTo(-100,-84);c.quadraticCurveTo(-120,-80,-150,-74);c.closePath();
  c.fillStyle='#4a4f5a';c.fill();
  rr(c,-100,-118,200,12,6,'#363a44');
  if(label){rr(c,-46,-104,92,26,4,'#fff6dd');txt(c,label,0,-91,18,'#6b2a14');}
  c.restore();
}
// 성문
function gate(c,x,y,label){
  c.save();c.translate(x,y);
  rr(c,-120,-110,240,110,4,'#a9a294');
  c.fillStyle='#968f80';for(let r=0;r<5;r++)for(let k=0;k<6;k++)c.fillRect(-118+k*40+(r%2)*20,-108+r*22,36,2);
  c.beginPath();c.moveTo(-34,0);c.lineTo(-34,-50);c.arc(0,-50,34,Math.PI,0);c.lineTo(34,0);c.closePath();c.fillStyle='#3a2a1e';c.fill();
  rr(c,-100,-160,200,50,3,'#b5402e');
  c.fillStyle='#e7d3a6';c.fillRect(-90,-150,180,8);
  c.beginPath();c.moveTo(-150,-150);c.quadraticCurveTo(-120,-160,-100,-190);c.lineTo(100,-190);c.quadraticCurveTo(120,-160,150,-150);c.lineTo(-150,-150);c.fillStyle='#454b55';c.fill();
  rr(c,-80,-206,160,20,8,'#454b55');
  rr(c,-44,-140,88,26,3,'#1e2a44');txt(c,label||'한양',0,-127,18,'#f2d27a');
  c.restore();
}
function tree(c,x,y,s){c.save();c.translate(x,y);c.scale(s,s);c.fillStyle='#7a5532';c.fillRect(-5,-40,10,40);circ(c,0,-58,26,'#4f9a4a');circ(c,-16,-46,18,'#5aa955');circ(c,16,-46,18,'#47904a');c.restore();}

// 사람 (옆모습). y는 발끝
function person(c,x,y,s,o={}){
  c.save();c.translate(x,y);c.scale(s,s);
  const st=o.step||0;
  ln(c,-4,-30,-4+Math.sin(st)*9,-1,o.pants||'#e5dcc5',7);
  ln(c,4,-30,4-Math.sin(st)*9,-1,o.pants||'#e5dcc5',7);
  if(o.armsUp){ln(c,-8,-56,-6,-80,'#f2c79b',5);ln(c,8,-56,6,-80,'#f2c79b',5);}
  else{ln(c,0,-56,-8+Math.sin(st+1)*8,-34,'#f2c79b',5);}
  rr(c,-11,-62,22,34,7,o.cloth||'#f6f1e3');
  c.fillStyle=o.belt||'#c9b48a';c.fillRect(-11,-42,22,3);
  circ(c,1,-72,10,'#f2c79b');
  circ(c,6,-73,1.5,'#3b2a1a');
  if(o.hat==='gat'){ell(c,0,-79,20,3.5,'#1d1d1d');rr(c,-8,-94,16,15,4,'#1d1d1d');}
  else if(o.hat==='band'){c.beginPath();c.arc(0,-74,10.5,Math.PI,0);c.fillStyle='#2a2018';c.fill();c.fillStyle='#f6f1e3';c.fillRect(-11,-79,22,4);circ(c,-2,-86,4,'#2a2018');}
  else if(o.hat==='braid'){c.beginPath();c.arc(0,-74,10.5,Math.PI,0);c.fillStyle='#2a2018';c.fill();ln(c,-8,-72,-12,-50,'#2a2018',4);}
  else {c.beginPath();c.arc(0,-74,10.5,Math.PI,0);c.fillStyle='#2a2018';c.fill();circ(c,0,-87,4.5,'#2a2018');}
  c.restore();
}
// 머리 (위에서 본 모습)
function headTop(c,x,y,r,hat){
  if(hat==='gat'){circ(c,x,y,r*1.8,'rgba(20,20,20,.85)');circ(c,x,y,r*0.85,'#1d1d1d');}
  else {circ(c,x,y,r,'#2a2018');circ(c,x,y,r*0.45,'#3b2e24');}
}
// 말 (옆모습, 오른쪽을 봄). y는 발끝
function horse(c,x,y,ph,col,rider){
  c.save();c.translate(x,y);
  const legs=[[-28,0],[-18,Math.PI],[20,Math.PI*0.5],[30,Math.PI*1.5]];
  for(const [lx,o] of legs){
    const a=Math.sin(ph+o)*0.55;
    const kx=lx+Math.sin(a)*22, ky=-48+Math.cos(a)*22;
    const a2=a+(Math.sin(ph+o)>0?-0.6:0.2);
    c.beginPath();c.moveTo(lx,-50);c.lineTo(kx,ky);c.lineTo(kx+Math.sin(a2)*24,ky+Math.cos(a2)*24);
    c.strokeStyle=col;c.lineWidth=8;c.lineCap='round';c.lineJoin='round';c.stroke();
  }
  c.beginPath();c.moveTo(-42,-62);c.quadraticCurveTo(-66,-56,-60,-30);c.strokeStyle='#3a2414';c.lineWidth=7;c.stroke();
  ell(c,0,-62,46,19,col);
  c.beginPath();c.moveTo(26,-72);c.lineTo(46,-108);c.lineTo(60,-102);c.lineTo(44,-58);c.closePath();c.fillStyle=col;c.fill();
  ell(c,62,-100,19,10,col,0.45);
  c.beginPath();c.moveTo(48,-114);c.lineTo(52,-126);c.lineTo(56,-112);c.fillStyle=col;c.fill();
  c.beginPath();c.moveTo(28,-74);c.lineTo(46,-110);c.lineTo(40,-112);c.lineTo(22,-76);c.fillStyle='#3a2414';c.fill();
  circ(c,64,-104,2,'#111');
  ln(c,70,-94,40,-80,'#5a3a1a',2);
  if(rider){
    rr(c,-14,-86,28,10,4,'#a33');

/* ---------------- 소리 ---------------- */
let AC=null, soundOn=true;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f1,f2,dur,type='square',vol=.08,delay=0){
  if(!soundOn)return;const a=ac();if(!a)return;
  const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(Math.max(30,f2),t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+0.02);
}
function noise(dur,vol=.1,freq=1200,delay=0){
  if(!soundOn)return;const a=ac();if(!a)return;
  const t=a.currentTime+delay,n=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;
  const g=a.createGain();g.gain.value=vol;s.connect(f).connect(g).connect(a.destination);s.start(t);
}
const SFX={
  jump(){tone(380,760,.14,'square',.06);},
  hit(){tone(220,70,.28,'sawtooth',.08);},
  step(){tone(200,160,.07,'triangle',.12);},
  bad(){tone(160,110,.18,'square',.07);},
  push(){noise(.18,.25,500);},
  row(){noise(.22,.22,700);tone(300,250,.08,'sine',.05);},
  shovel(){noise(.1,.3,2500);},
  choo(){noise(.12,.25,1800);noise(.12,.25,1800,.18);},
  whistle(){tone(880,900,.5,'sine',.07);tone(1100,1120,.5,'sine',.04);},
  crash(){noise(.3,.3,3200);tone(900,300,.2,'triangle',.05);},
  ok(){tone(660,660,.1,'triangle',.08);tone(880,880,.14,'triangle',.08,.1);},
  win(){[523,659,784,1046].forEach((f,i)=>tone(f,f,.18,'triangle',.09,i*.12));},

};

const keys={left:0,right:0,up:0,down:0,action:0};
const pressed=new Set();
const KEYMAP={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',Space:'action',Enter:'action'};
function setKey(k,v){if(v&&!keys[k])pressed.add(k);keys[k]=v?1:0;}
function tap(k){return pressed.has(k);}
addEventListener('keydown',e=>{
  const k=KEYMAP[e.code];if(!k||scene!=='play')return;

function flowAt(y){const f=1-Math.pow((y-295)/185,2);return 18+80*Math.max(0,f);}
function riverScene(c,flowMul,seed){
  c.fillStyle='#8cc56b';c.fillRect(0,0,W,H);
  const g=c.createLinearGradient(0,108,0,482);g.addColorStop(0,'#6cc0e0');g.addColorStop(.5,'#3a8cc4');g.addColorStop(1,'#6cc0e0');
  c.beginPath();c.moveTo(0,110);for(let x=0;x<=W;x+=20)c.lineTo(x,108+Math.sin(x/60+seed)*5);
  c.lineTo(W,482);for(let x=W;x>=0;x-=20)c.lineTo(x,484+Math.sin(x/70+seed)*5);c.closePath();
  c.fillStyle='#ead39c';c.fill();
  c.beginPath();c.moveTo(0,118);for(let x=0;x<=W;x+=20)c.lineTo(x,120+Math.sin(x/60+seed)*5);
  c.lineTo(W,472);for(let x=W;x>=0;x-=20)c.lineTo(x,472+Math.sin(x/70+seed)*5);c.closePath();
  c.fillStyle=g;c.fill();
  c.strokeStyle='rgba(255,255,255,.4)';c.lineWidth=2;c.lineCap='round';
  for(let i=0;i<30;i++){
    const y=132+(i*47.3)%330,sp=flowAt(y)*flowMul,len=14+sp*0.35;
    for(const off of [0,0.5]){const x=((hash(i+seed)+off)*(W+120)+T*sp)%(W+120)-60;c.beginPath();c.moveTo(x,y);c.lineTo(x+len,y);c.stroke();}
  }
  for(let k=0;k<12;k++){
    tree(c,40+k*85+hash(k+seed)*30,70+hash(k*3)*20,0.7);
    if(hash(k+seed*2)<0.5){c.save();c.translate(30+k*80+hash(k*5)*40,520);for(let j=0;j<4;j++)ln(c,j*5,0,j*5-4,-22,'#5a9a44',2);c.restore();}
  }
}

    s.y+=Math.sin(s.ang)*s.sp*dt+Math.sin(s.wind)*10*dt;
    s.x=clamp(s.x,24,W-24);s.y=clamp(s.y,90,H-24);
    s.isl.forEach((is,i)=>{
      const dx=s.x-is.x,dy=s.y-is.y,d=Math.hypot(dx,dy);
      if(i===s.next&&d<is.r+30){s.next++;sfx('ok');addFx(s,is.x,is.y-is.r-10,'물건 배달 완료!','#b8f5c6');
        if(s.next>=3)finish(s,s.time<40?3:s.time<70?2:1,`바람을 타고 섬 3곳을 ${s.time.toFixed(1)}초 만에 돌았어요!`);}
      else if(d<is.r+22&&d>0){s.x=is.x+dx/d*(is.r+22);s.y=is.y+dy/d*(is.r+22);s.sp*=0.6;}
    });
    for(const r of s.rocks){const dx=s.x-r.x,dy=s.y-r.y,d=Math.hypot(dx,dy);if(d<r.r+22&&d>0){s.x=r.x+dx/d*(r.r+22);s.y=r.y+dy/d*(r.r+22);s.sp*=0.4;if(!s.rockT||s.time-s.rockT>1){s.rockT=s.time;sfx('hit');addFx(s,s.x,s.y-30,'쿵! 바위 조심','#ffb4a8');}}}
  },
  draw(c,s,preview){
    const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#3d9fd1');g.addColorStop(1,'#2a78b3');c.fillStyle=g;c.fillRect(0,0,W,H);
    // 바람 줄무늬
    const wx=Math.cos(s.wind),wy=Math.sin(s.wind);
    c.strokeStyle='rgba(255,255,255,.28)';c.lineWidth=2;c.lineCap='round';
    for(let i=0;i<34;i++){
      const bx=hash(i)*W,by=hash(i+50)*H,tt=(T*0.5+hash(i+9))%1;
      const x=((bx+wx*tt*260)%W+W)%W,y=((by+wy*tt*260)%H+H)%H;
      c.globalAlpha=Math.sin(tt*Math.PI);c.beginPath();c.moveTo(x,y);c.quadraticCurveTo(x+wx*14-wy*4,y+wy*14+wx*4,x+wx*30,y+wy*30);c.stroke();
    }
    c.globalAlpha=1;
    for(const r of s.rocks){circ(c,r.x,r.y,r.r+6,'rgba(255,255,255,.3)');ell(c,r.x,r.y,r.r,r.r*0.85,'#6f7074');ell(c,r.x-5,r.y-5,r.r*0.4,r.r*0.3,'#999a9e');}
    s.isl.forEach((is,i)=>{
      if(i===s.next&&!preview){c.save();c.globalAlpha=0.3+0.25*Math.sin(T*5);circ(c,is.x,is.y,is.r+30,'#fff');c.restore();}
      circ(c,is.x,is.y,is.r+12,'#7fc7e3');circ(c,is.x,is.y,is.r,'#ecd49a');circ(c,is.x,is.y,is.r-14,'#6fb05a');
      circ(c,is.x-12,is.y-10,12,'#4f9a4a');circ(c,is.x+14,is.y+8,10,'#4f9a4a');
      rr(c,is.x-8,is.y+2,18,14,2,'#d6ad5f');
      const done=i<s.next;
      rr(c,is.x-18,is.y-is.r-30,36,30,8,done?'#3bb36a':'#d9452b');txt(c,done?'✓':['①','②','③'][i],is.x,is.y-is.r-15,22,'#fff');
    });
    // 배 (위에서)
    c.save();c.translate(s.x,s.y);
    c.save();c.rotate(s.ang);
    ell(c,0,5,40,16,'rgba(0,0,0,.18)');
    c.beginPath();c.moveTo(42,0);c.quadraticCurveTo(14,-18,-34,-14);c.lineTo(-38,0);c.lineTo(-34,14);c.quadraticCurveTo(14,18,42,0);c.closePath();c.fillStyle='#8a5a32';c.fill();
    c.beginPath();c.moveTo(34,0);c.quadraticCurveTo(12,-12,-28,-9);c.lineTo(-30,0);c.lineTo(-28,9);c.quadraticCurveTo(12,12,34,0);c.closePath();c.fillStyle='#b98250';c.fill();
    headTop(c,-22,0,7,'band');
    c.restore();
    // 돛: 바람을 받아 부풂
    const eff=s.eff==null?0.6:s.eff;
    const sa=s.ang+Math.PI/2;const sx=Math.cos(sa),sy=Math.sin(sa);
    const bulge=6+22*eff;
    c.beginPath();c.moveTo(sx*30,sy*30);c.quadraticCurveTo(wx*bulge*2,wy*bulge*2,-sx*30,-sy*30);c.quadraticCurveTo(wx*bulge*0.6,wy*bulge*0.6,sx*30,sy*30);
    c.fillStyle='#f3ead5';c.fill();c.strokeStyle='#8a7a5a';c.lineWidth=2;c.stroke();
    circ(c,0,0,4,'#5a3a1a');
    c.restore();
    if(!preview){
      hud(c,this,s,[`🏝 ${s.next} / 3`],s.next/3);
      // 바람 나침반
      const cx=W-70,cy=H-70;
      circ(c,cx,cy,52,'rgba(255,250,240,.92)');txt(c,'바람',cx,cy-36,16,'#3b2a1a');
      c.save();c.translate(cx,cy+6);c.rotate(s.wind);
      ln(c,-28,0,22,0,'#2a78b3',8);c.beginPath();c.moveTo(34,0);c.lineTo(16,-13);c.lineTo(16,13);c.fillStyle='#2a78b3';c.fill();
      c.restore();
      const pct=Math.round(eff*100);
      rr(c,16,H-56,240,40,20,'rgba(255,250,240,.92)');
      rr(c,92,H-44,150,16,8,'#d8ccb4');rr(c,92,H-44,Math.max(16,150*eff),16,8,eff>0.7?'#3bb36a':eff>0.4?'#f2b632':'#e05a3a');
      txt(c,'돛 바람',52,H-36,17,'#3b2a1a');
    }
  }
});

STAGES.push({
  id:'train',name:'증기 기차',title:'석탄을 넣어 칙칙폭폭!',power:'기계(수증기)의 힘',ptype:'machine',group:'new',
  fact:'과학 기술이 발달하면서, 물을 끓일 때 생기는 수증기의 힘으로 움직이는 기차와 배가 만들어졌어요.',
  mission:'기관사가 되어 석탄을 넣고(🔥) 증기 압력을 <b>초록색</b>에 맞춰요. 너무 많이 넣으면 넘쳐요!<br>역이 보이면 ⬇ 브레이크로 승강장에 딱 멈춰 손님을 태워요.',

  init(){
    return {d:0,sp:0,p:35,time:0,fx:[],stations:[{x:3000,name:'중간역',st:0},{x:6600,name:'종착역',st:0}],
      stopT:0,overT:0,miss:0,puffT:0,puffN:0,smoke:[],shovel:0,endAfter:false};
  },
  update(s,dt){
    s.time+=dt;
    if(s.shovel>0)s.shovel-=dt*3;

    if(s.p>100){s.overT=1.3;s.p=60;sfx('whistle');addFx(s,520,240,'삐익~! 압력이 넘쳤어요','#ffd27a');}
    s.p=clamp(s.p,0,100);if(s.overT>0)s.overT-=dt;
    const eff=s.overT>0?0.25:s.p<15?s.p/15*0.3:Math.min(1,0.3+0.7*(s.p-15)/45);
    const tg=360*eff;
    if(s.stopT>0){s.stopT-=dt;s.sp=0;if(s.stopT<=0&&s.endAfter){finish(s,s.miss===0&&s.time<60?3:s.miss<=1?2:1,`역 정차 실패 ${s.miss}번 · ${s.time.toFixed(1)}초`);}}
    else if(keys.down)s.sp=Math.max(0,s.sp-400*dt);
    else s.sp+=(tg-s.sp)*Math.min(1,dt*0.8);
    s.d+=s.sp*dt;
    s.stations.forEach((st,i)=>{
      if(st.st!==0)return;const rel=st.x-s.d,last=i===s.stations.length-1;
      if(Math.abs(rel)<140&&s.sp<8&&s.stopT<=0){st.st=1;s.stopT=1.6;s.sp=0;sfx('ok');addFx(s,520,200,last?'종착역 도착! 정차 성공':'정차 성공! 손님이 탔어요','#b8f5c6');if(last)s.endAfter=true;}
      else if(rel<-150){st.st=2;s.miss++;sfx('bad');addFx(s,520,200,'앗, 역을 지나쳤어요!','#ffb4a8');
        if(last)finish(s,s.miss<=1?2:1,`역 정차 실패 ${s.miss}번 · ${s.time.toFixed(1)}초`);}
    });
    s.puffT-=dt*(s.sp/110+0.35);
    if(s.puffT<=0){s.puffT=1;s.puffN++;s.smoke.push({wx:s.d,y:0,t:0});if(s.sp>40&&s.puffN%4===0){addFx(s,575,150,'칙칙폭폭','#fff');sfx('choo');}}
    for(const p of s.smoke)p.t+=dt;s.smoke=s.smoke.filter(p=>p.t<2.2);

  draw(c,s,preview){

    mountains(c,s.d*0.06,300,'#a7bccb',90,400);

    c.fillStyle='#8cc56b';c.fillRect(0,G-34,W,H-G+34);
    // 전봇대
    for(let k=Math.floor(s.d/320);k<Math.floor(s.d/320)+5;k++){const x=k*320-s.d;ln(c,x,G-30,x,G-150,'#7a5532',5);ln(c,x-16,G-140,x+16,G-140,'#7a5532',4);}
    c.strokeStyle='#555';c.lineWidth=1;c.beginPath();c.moveTo(0,G-138);c.lineTo(W,G-138);c.stroke();
    // 역
    s.stations.forEach(st=>{
      const x=TX+(st.x-s.d);if(x<-400||x>W+400)return;
      rr(c,x-150,G-22,300,22,2,st.st===0?'#e8d6a8':'#c9e9c9');
      if(!preview&&st.st===0){c.save();c.globalAlpha=0.3+0.2*Math.sin(T*6);c.fillStyle='#3bb36a';c.fillRect(x-140,G-22,280,22);c.restore();}
      rr(c,x-70,G-120,140,98,4,'#f0e2c4');c.beginPath();c.moveTo(x-90,G-118);c.lineTo(x,G-160);c.lineTo(x+90,G-118);c.fillStyle='#b5402e';c.fill();
      rr(c,x-24,G-82,48,60,3,'#7a5532');
      rr(c,x-56,G-150,112,28,4,'#1e2a44');txt(c,st.name,x,G-136,18,'#f2d27a');
      for(let k=0;k<3;k++)if(st.st===0)person(c,x+60+k*22,G-22,0.6,{hat:k===1?'gat':'braid',cloth:['#f6f1e3','#dfe9f2','#f3dce0'][k]});
    });
    // 선로
    c.fillStyle='#8a7560';c.fillRect(0,G,W,24);
    c.fillStyle='#6b4524';for(let k=Math.floor(s.d/34);k<Math.floor(s.d/34)+32;k++){c.fillRect(k*34-s.d,G+2,16,20);}
    ln(c,0,G+4,W,G+4,'#666',4);ln(c,0,G+18,W,G+18,'#666',4);
    // 연기
    for(const p of s.smoke){const x=TX-48+(p.wx-s.d)-p.t*30,y=G-176-p.t*60;c.save();c.globalAlpha=Math.max(0,0.7-p.t*0.32);circ(c,x,y,14+p.t*18,'#eeeeee');c.restore();}
    // 기차

    for(let k=0;k<2;k++){const cx=TX-260-k*170;rr(c,cx-75,G-100,150,78,8,k?'#3c6e47':'#7a3b22');rr(c,cx-80,G-108,160,12,5,'#2a2a2a');
      for(let w=0;w<4;w++)rr(c,cx-62+w*32,G-88,24,24,3,'#f3e3c0');wheel(cx-48,14);wheel(cx+48,14);ln(c,cx+75,G-34,cx+95,G-34,'#333',5);}
    rr(c,TX-140,G-128,60,100,6,'#222');rr(c,TX-132,G-118,44,34,4,'#f3e3c0');
    if(s.shovel>0)person(c,TX-110,G-40,0.55,{hat:'band',cloth:'#4a5a7a',armsUp:true});

    circ(c,TX-6,G-104,10,'#c9a227');
    circ(c,TX+28,G-66,9,'#f2d27a');
    c.beginPath();c.moveTo(TX+26,G-30);c.lineTo(TX+52,G-4);c.lineTo(TX+20,G-4);c.closePath();c.fillStyle='#b83a2a';c.fill();
    wheel(TX-110,18);wheel(TX-60,22);wheel(TX-8,22);

    if(s.overT>0){c.save();c.globalAlpha=0.7;circ(c,TX-30,G-110,30+Math.sin(T*30)*5,'#fff');c.restore();}

      // 압력계

      arc(0,0.5,'#d8ccb4');arc(0.5,0.85,'#3bb36a');arc(0.85,1,'#e05a3a');

/* =========================================================
   화면 흐름
   ========================================================= */
let scene='title',cur=null,st=null;
const $=id=>document.getElementById(id);
const cv=$('cv'),ctx=cv.getContext('2d');
function fitCanvas(){const dpr=Math.min(2,window.devicePixelRatio||1);const r=cv.getBoundingClientRect();const w=Math.max(320,r.width);cv.width=Math.round(w*dpr);cv.height=Math.round(w*9/16*dpr);}
addEventListener('resize',()=>{if(scene==='play')fitCanvas();});

let progress={};
try{progress=JSON.parse(localStorage.getItem('oldTransport.v1')||'{}')||{};}catch(e){progress={};}
function saveProgress(){try{localStorage.setItem('oldTransport.v1',JSON.stringify(progress));}catch(e){}}

function show(id){['title','map','play','sort'].forEach(x=>$(x).classList.toggle('hidden',x!==id));scene=id;window.scrollTo(0,0);}

function starHTML(n){let h='';for(let i=0;i<3;i++)h+=i<n?'★':'<span class="off">★</span>';return h;}

function renderMap(){
  for(const grp of ['old','new']){
    const box=$(grp==='old'?'cardsOld':'cardsNew');box.innerHTML='';
    STAGES.filter(s=>s.group===grp).forEach(stage=>{
      const b=document.createElement('button');b.className='card';
      const p=progress[stage.id];
      b.innerHTML=`<canvas width="480" height="270"></canvas>
        <div class="nm">${stage.name}<span class="stars">${starHTML(p?p.stars:0)}</span></div>
        <span class="pw ${stage.ptype}">${stage.power}</span>
        ${p&&p.stamp?'<div class="stamp">참<br>잘했어요</div>':''}`;
      b.onclick=()=>startStage(stage);
      box.appendChild(b);
      const pc=b.querySelector('canvas').getContext('2d');pc.scale(0.5,0.5);
      try{stage.draw(pc,stage.init(),true);}catch(e){console.error(e);}
    });
  }
}

function startStage(stage){
  cur=stage;st=stage.init();
  show('play');fitCanvas();
  const pad=$('pad');pad.innerHTML='';
  for(const [k,label] of stage.pad){
    const b=document.createElement('button');b.className='pbtn';b.textContent=label;
    const on=e=>{e.preventDefault();ac();try{b.setPointerCapture(e.pointerId);}catch(_){}setKey(k,1);b.classList.add('on');};
    const off=e=>{setKey(k,0);b.classList.remove('on');};
    b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off);
    b.addEventListener('contextmenu',e=>e.preventDefault());
    pad.appendChild(b);
  }
  $('introPanel').innerHTML=`
    <h3>${stage.name}</h3>
    <div class="tag">${stage.power}</div>
    <div class="fact">📖 ${stage.fact}</div>
    <div class="mission">🎯 ${stage.mission}</div>
    <div class="keys">${stage.keysHelp.map(([k,v])=>`<div><b>${k}</b> ${v}</div>`).join('')}</div>
    <button class="bigbtn" id="btnGo">출발!</button>`;
  $('intro').classList.remove('hidden');$('result').classList.add('hidden');
  $('btnGo').onclick=()=>{ac();$('intro').classList.add('hidden');for(const k in keys)keys[k]=0;pressed.clear();cv.focus&&cv.focus();};
  setTimeout(()=>{const g=$('btnGo');g&&g.focus();},50);
}

function showResult(){
  const q=cur.quiz;
  $('resultPanel').innerHTML=`
    <h3>임무 성공! 🎉</h3>
    <div class="resstars">${starHTML(st.stars)}</div>
    <div class="mission">${st.msg}</div>
    <div class="quiz"><div class="q">🤔 ${q.q}</div>
      ${q.c.map((t,i)=>`<button class="choice" data-i="${i}">${['①','②','③'][i]} ${t}</button>`).join('')}
      <div class="explain" id="explain"></div></div>
    <div class="maprow" id="resBtns" style="margin:8px 0 0"></div>`;
  $('result').classList.remove('hidden');
  let solved=false;
  $('resultPanel').querySelectorAll('.choice').forEach(b=>{
    b.onclick=()=>{
      if(solved)return;const i=+b.dataset.i;
      if(i===q.a){solved=true;b.classList.add('right');sfx('ok');$('explain').textContent='정답! '+q.ex;
        const old=progress[cur.id]||{stars:0};progress[cur.id]={stars:Math.max(old.stars||0,st.stars),stamp:true};saveProgress();
        $('resBtns').innerHTML='<button class="bigbtn" id="btnStamp">🖋 도장 받고 지도로</button><button class="bigbtn ghost" id="btnAgain">↺ 한 번 더</button>';
        $('btnStamp').onclick=()=>{renderMap();show('map');};
        $('btnAgain').onclick=()=>startStage(cur);
      }else{b.classList.remove('wrong');void b.offsetWidth;b.classList.add('wrong');sfx('bad');$('explain').textContent='다시 생각해 볼까요?';}
    };
  });
}

/* ---------------- 메인 루프 ---------------- */
let lastTs=0;
function frame(ts){
  const dt=Math.min(0.05,lastTs?(ts-lastTs)/1000:0);lastTs=ts;T+=dt;
  if(scene==='play'&&cur&&st){
    const paused=!$('intro').classList.contains('hidden');
    if(!paused){
      if(!st.done)cur.update(st,dt);
      else{st.doneT+=dt;if(st.doneT>1.4&&!st.shown){st.shown=true;showResult();}}
      for(const f of st.fx)f.t+=dt;st.fx=st.fx.filter(f=>f.t<1.4);
    }
    const sc=cv.width/W;
    ctx.setTransform(sc,0,0,sc,0,0);
    cur.draw(ctx,st,false);
    drawFx(ctx,st);
    if(st.done){ctx.save();ctx.globalAlpha=Math.min(1,st.doneT*2);txt(ctx,'도착! 임무 성공!',W/2,H/2,64,'#fff','center','rgba(217,69,43,.95)');ctx.restore();}
  }else if(scene==='title'){drawTitle();}
  pressed.clear();
  requestAnimationFrame(frame);
}

// 타이틀 그림: 여러 교통수단이 지나가는 장면
const tc=$('titleArt').getContext('2d');
function drawTitle(){
  const c=tc;c.setTransform(1.5,0,0,1.5,0,0);
  const HH=420;
  const g=c.createLinearGradient(0,0,0,HH);g.addColorStop(0,'#8fd0f5');g.addColorStop(1,'#e8f6ff');c.fillStyle=g;c.fillRect(0,0,W,HH);
  circ(c,820,70,34,'#fff3b0');clouds(c,T*20);
  mountains(c,T*8,230,'#a9bfd0',90,380);mountains(c,T*20,280,'#86ad84',60,250);
  c.fillStyle='#4aa0d0';c.fillRect(0,330,W,90);
  c.strokeStyle='rgba(255,255,255,.4)';c.lineWidth=2;for(let i=0;i<14;i++){const x=(hash(i)*W+T*40)%(W+60)-30,y=345+(i*13)%70;ln(c,x,y,x+24,y,'rgba(255,255,255,.45)',2);}
  c.fillStyle='#d9b77a';c.fillRect(0,290,W,40);c.fillStyle='#8cc56b';c.fillRect(0,282,W,10);
  const hx=((T*140)%(W+300))-150;horse(c,hx,318,T*12,'#8a5530',true);
  const px=W-((T*60)%(W+300))+150;
  person(c,px-60,318,0.9,{step:T*8,hat:'band',armsUp:true});person(c,px+60,318,0.9,{step:T*8+Math.PI,hat:'band',armsUp:true});
  c.save();c.translate(px,240);ln(c,-80,0,80,0,'#6b4524',5);rr(c,-36,-66,72,62,5,'#a64d2c');rr(c,-18,-54,36,30,3,'#f3e3c0');
  c.beginPath();c.moveTo(-46,-64);c.quadraticCurveTo(0,-92,46,-64);c.fillStyle='#3d2a1e';c.fill();c.restore();
  const bx=((T*50)%(W+300))-150;
  c.save();c.translate(bx,372);
  c.beginPath();c.moveTo(-70,0);c.lineTo(70,0);c.lineTo(54,22);c.lineTo(-56,22);c.closePath();c.fillStyle='#8a5a32';c.fill();
  ln(c,0,0,0,-110,'#5a3a1a',4);
  c.beginPath();c.moveTo(4,-104);c.quadraticCurveTo(50+Math.sin(T*3)*4,-60,4,-8);c.closePath();c.fillStyle='#f3ead5';c.fill();
  person(c,-40,4,0.7,{hat:'gat'});c.restore();
}

/* ---------------- 정리 활동 ---------------- */
const BINS=[
  {id:'human',name:'사람의 힘',desc:'사람이 직접 들거나 밀거나 저어요',items:['가마','뗏목','나룻배']},
  {id:'animal',name:'동물의 힘',desc:'소나 말을 이용해요',items:['말','달구지']},
  {id:'nature',name:'자연의 힘',desc:'바람 같은 자연의 힘을 이용해요',items:['돛단배']},
  {id:'machine',name:'기계의 힘',desc:'기술이 발달하며 기계로 움직여요',items:['증기 기차','증기선','자동차','비행기']},
];
let sortSel=null;
function renderSort(){
  const all=BINS.flatMap(b=>b.items.map(n=>({n,bin:b.id})));
  for(let i=all.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[all[i],all[j]]=[all[j],all[i]];}
  const tray=$('tray');tray.innerHTML='';sortSel=null;$('summary').classList.add('hidden');
  all.forEach(it=>{const b=document.createElement('button');b.className='chip';b.textContent=it.n;b.dataset.bin=it.bin;
    b.onclick=()=>{tray.querySelectorAll('.chip').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sortSel=b;sfx('step');};tray.appendChild(b);});
  const bins=$('bins');bins.innerHTML='';
  BINS.forEach(bn=>{const d=document.createElement('button');d.className='bin';d.innerHTML=`<h4>${bn.name}</h4><p>${bn.desc}</p><div class="in"></div>`;
    d.onclick=()=>{
      if(!sortSel)return;
      if(sortSel.dataset.bin===bn.id){const sp=document.createElement('span');sp.textContent=sortSel.textContent;d.querySelector('.in').appendChild(sp);sortSel.remove();sortSel=null;sfx('ok');
        if(!tray.children.length){sfx('win');const s=$('summary');s.classList.remove('hidden');
          s.innerHTML='🎉 모두 정리했어요!<br>옛날 교통수단은 <b>자연</b>에서 쉽게 얻는 재료로 만들고, <b>사람·동물·자연(바람)의 힘</b>을 이용했어요.<br>과학 기술이 발달하면서 수증기와 석유 같은 <b>기계</b>의 힘으로 움직이는 교통수단이 생겼어요.';}}
      else{const t=sortSel;t.classList.remove('wrong');void t.offsetWidth;t.classList.add('wrong');sfx('bad');}
    };bins.appendChild(d);});
}

/* ---------------- 버튼 ---------------- */

$('btnQuit').onclick=()=>{renderMap();show('map');};
$('btnRetry').onclick=()=>{if(cur)startStage(cur);};
$('btnSound').onclick=()=>{soundOn=!soundOn;$('btnSound').textContent=soundOn?'🔊 소리 켬':'🔇 소리 끔';};
$('btnSort').onclick=()=>{renderSort();show('sort');};
$('btnSortBack').onclick=()=>{renderMap();show('map');};
$('btnReset').onclick=()=>{if(confirm('모든 도장과 별 기록을 지울까요?')){progress={};saveProgress();renderMap();}};
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(scene==='map')renderMap();});
requestAnimationFrame(frame);
